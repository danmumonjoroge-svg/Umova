<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Umova — no internet yet</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #F5F7F2; color: #26352D; margin: 0; display: grid; place-items: center; min-height: 100vh; padding: 24px; text-align: center; }
    .card { max-width: 380px; background: #fff; border: 1px solid #DDE3DD; border-radius: 16px; padding: 24px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #68756D; font-size: 15px; line-height: 1.5; margin: 8px 0; }
    button { margin-top: 12px; min-height: 48px; width: 100%; border: 0; border-radius: 12px; background: #237A52; color: #fff; font-weight: 600; font-size: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>No internet yet</h1>
    <p>This phone has not opened the app with internet before, so there is nothing saved to work from.</p>
    <p>Connect to the internet once and open the app. After that it will open and work even with no signal.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
